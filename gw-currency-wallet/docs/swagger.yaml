basePath: /api/v1
definitions:
  http.BalanceResponse:
    properties:
      balance:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  http.DepositRequest:
    properties:
      amount:
        type: number
      currency:
        enum:
        - USD
        - RUB
        - EUR
        type: string
    required:
    - amount
    - currency
    type: object
  http.DepositResponse:
    properties:
      message:
        type: string
      new_balance:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  http.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  http.ExchangeRequest:
    properties:
      amount:
        type: number
      from_currency:
        enum:
        - USD
        - RUB
        - EUR
        type: string
      to_currency:
        enum:
        - USD
        - RUB
        - EUR
        type: string
    required:
    - amount
    - from_currency
    - to_currency
    type: object
  http.ExchangeResponse:
    properties:
      exchanged_amount:
        type: number
      message:
        type: string
      new_balance:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  http.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  http.MessageResponse:
    properties:
      message:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  http.TokenResponse:
    properties:
      token:
        type: string
    type: object
  http.WithdrawRequest:
    properties:
      amount:
        type: number
      currency:
        enum:
        - USD
        - RUB
        - EUR
        type: string
    required:
    - amount
    - currency
    type: object
host: localhost:8080
info:
  contact: {}
  description: Кошелёк-обменник с JWT-аутентификацией
  title: gw-currency-wallet API
  version: "1.0"
paths:
  /balance:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.BalanceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение баланса
      tags:
      - wallet
  /exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ExchangeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обмен валют
      tags:
      - exchange
  /exchange/rates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              additionalProperties:
                format: float64
                type: number
              type: object
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Курсы валют
      tags:
      - exchange
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Авторизация
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /wallet/deposit:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.DepositResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Пополнение счёта
      tags:
      - wallet
  /wallet/withdraw:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.WithdrawRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.DepositResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Вывод средств
      tags:
      - wallet
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
